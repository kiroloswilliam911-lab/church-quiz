services:
  - type: web
    name: church-quiz
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: church-quiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_CODE
        generateValue: true
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/uploads
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PRIMARY_HOST_EMAIL
        sync: false

databases:
  - name: church-quiz-db
    databaseName: churchquiz
    user: churchquiz
    plan: free
    region: frankfurt
