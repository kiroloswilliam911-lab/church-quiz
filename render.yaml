services:
  - type: web
    name: church-quiz
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: church-quiz-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: church-quiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_CODE
        generateValue: true
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: church-quiz-db
    databaseName: churchquiz
    user: churchquiz
    plan: 0.1c-256mb
    region: frankfurt
