<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - مسابقات الكنيسة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(7, 28, 48, 0.48), rgba(7, 28, 48, 0.62)), url("{{ url_for('static', filename='images/masabaqa.jpg') }}") center / cover fixed no-repeat;
            color: #fff;
            margin: 0;
            padding: 24px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            color: #2d3436;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            color: #0984e3;
            margin-bottom: 20px;
        }
        p {
            line-height: 1.7;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .message {
            color: #087f5b;
            margin-bottom: 15px;
            line-height: 1.7;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #0984e3;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>استعادة كلمة المرور</h2>
        {% if message %}
            <p class="message">{{ message }}</p>
        {% else %}
            <p>اكتب البريد الإلكتروني المسجّل في حسابك، وسنرسل إليه رابطًا لتغيير كلمة المرور.</p>
            <form method="POST">
                <input type="email" name="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
                <button type="submit" class="btn">إرسال رابط الاستعادة</button>
            </form>
        {% endif %}
        <a href="{{ url_for('login') }}" class="back-link">العودة لتسجيل الدخول</a>
    </div>
</body>
</html>
