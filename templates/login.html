    <!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>تسجيل الدخول - مسابقات الكنيسة</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(rgba(7, 28, 48, 0.48), rgba(7, 28, 48, 0.62)), url("{{ url_for('static', filename='images/masabaqa.jpg') }}") center / cover fixed no-repeat;
                color: #fff;
                margin: 0;
                padding: 16px 12px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                min-height: 100dvh;
            }
            .card {
                background: white;
                color: #2d3436;
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                max-width: 400px;
                width: 100%;
                text-align: center;
            }
            h2 {
                color: #0984e3;
                margin-bottom: 20px;
            }
            input {
                width: 100%;
                padding: 12px;
                margin: 10px 0;
                border: 1px solid #dfe6e9;
                border-radius: 8px;
                box-sizing: border-box;
                font-size: 16px;
            }
            .btn {
                background: #00b894;
                color: white;
                border: none;
                padding: 12px;
                width: 100%;
                border-radius: 25px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 15px;
                transition: 0.3s;
            }
            .btn:hover {
                background: #00a884;
            }
            .error {
                color: #d63031;
                margin-bottom: 15px;
                font-size: 14px;
            }
            .back-link {
                display: block;
                margin-top: 20px;
                color: #0984e3;
                text-decoration: none;
                font-size: 14px;
            }
            .back-link:hover {
                text-decoration: underline;
            }
            @media (max-width: 480px) {
                .card {
                    padding: 28px 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>تسجيل الدخول</h2>
            
            {% if message %}
                <div class="error">{{ message }}</div>
            {% endif %}

            <form method="POST">
                {% if next_page %}<input type="hidden" name="next" value="{{ next_page }}">{% endif %}
                <input type="text" name="username" placeholder="البريد الإلكتروني أو اسم المستخدم" autocomplete="username" required>
                <input type="password" name="password" placeholder="كلمة المرور" required>
                <button type="submit" class="btn">دخول</button>
            </form>
            
            <a href="{{ url_for('forgot_password') }}" class="back-link">نسيت كلمة المرور؟</a>
            <a href="/register" class="back-link">ليس لديك حساب؟ أنشئ حساباً جديداً</a>
            <a href="/" class="back-link">العودة للرئيسية</a>
        </div>
    </body>
    </html>
