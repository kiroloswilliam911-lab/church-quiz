<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مسابقات الكنيسة</title>
    <!-- استيراد خط عربي عصري وجذاب -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(rgba(7, 28, 48, 0.48), rgba(7, 28, 48, 0.62)), url("{{ url_for('static', filename='images/masabaqa.jpg') }}") center / cover fixed no-repeat;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .hero-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        p {
            color: #dcdde1;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .buttons-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-login {
            background: #ffffff;
            color: #1e3c72;
        }
        .btn-login:hover {
            background: #f1f2f6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn-register {
            background: #00b894;
            color: #ffffff;
        }
        .btn-register:hover {
            background: #019875;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        @media (max-width: 480px) {
            .buttons-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="icon">⛪</div>
        <h1>مدرسة القديس تيموثاوس دفعه الملاك رافئيل</h1>
        <p>هنا تقدر تتابع دراجاتك و مسابقاتك اليوميه</p>
        
        <div class="buttons-group">
            <a href="/login" class="btn btn-login">تسجيل الدخول</a>
            <a href="/register" class="btn btn-register">إنشاء حساب جديد</a>
        </div>
    </div>

</body>
</html>
